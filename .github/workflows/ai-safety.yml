name: AI Safety

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Provider key server-only, errors redacted, usage capped
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          if grep -rn "NVIDIA_API_KEY" app components --include='*.ts' --include='*.tsx'; then
            fail "NVIDIA_API_KEY reachable from client code"
          fi
          grep -q "redactProviderMessage" lib/ai/nvidia.ts || fail "provider error redaction is missing"
          grep -q "assertAiUsageAllowed" app/api/ai/research/route.ts || fail "AI route does not enforce daily usage allowance"
          grep -q "recordAiUsage" app/api/ai/research/route.ts || fail "AI route does not record usage"
          grep -q "getClientIp" app/api/ai/research/route.ts || fail "AI route does not use server-resolved client IP"
          echo "AI safety OK"
