name: Auth Guards

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: auth-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Every non-public API route must enforce authentication
        run: |
          # These routes are intentionally public (login/signup/reset, public
          # news feed, public partner application, click capture, signed
          # webhooks, catch-all 404). The one x402 content route is checked
          # separately for payment gates: it serves shared educational content,
          # not user data, and bot clients pay without an account session.
          # Everything else must call requireUser, requireAdmin, or
          # requireAdminOwner (matched via requireAdmin).
          public=$(cat <<'EOF'
          app/api/[...notFound]/route.ts
          app/api/auth/signin/route.ts
          app/api/auth/signup/route.ts
          app/api/auth/reset-request/route.ts
          app/api/auth/reset-password/route.ts
          app/api/news/route.ts
          app/api/partner/applications/route.ts
          app/api/referrals/capture/route.ts
          app/api/webhooks/uropay/route.ts
          app/api/x402/content/route.ts
          EOF
          )
          failed=0
          for f in $(git ls-files 'app/api/**/route.ts'); do
            # -F: paths contain regex chars ([...notFound]) — match literally.
            if echo "$public" | grep -qxF "$f"; then continue; fi
            # Exact-path exception, NOT a blanket exemption for /api/x402/*.
            # Keep verification, rejection, and settlement checks mandatory.
            # Like the login-helper check below, these are static smoke checks,
            # not a substitute for runtime payment-protocol tests.
            if [ "$f" = "app/api/x402/content/route.ts" ]; then
              for gate in \
                'await processX402Request(' \
                'processResult.type === "payment-error"' \
                'return buildX402Response(processResult)' \
                'processResult.type === "payment-verified"' \
                'server.processSettlement(' \
                'if (!settleResult.success)' \
                'return buildX402Response({ response: settleResult.response })'; do
                if ! grep -qF "$gate" "$f"; then
                  echo "FAIL: $f is missing x402 payment gate: $gate"
                  failed=1
                fi
              done
              continue
            fi
            if ! grep -qE "requireUser|requireAdmin" "$f"; then
              echo "FAIL: $f has no requireUser/requireAdmin/requireAdminOwner gate"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Auth gates OK"

      - name: No shared admin password path
        run: |
          if grep -rn "body\.password" app/api/c8f2x9/login/route.ts; then
            echo "FAIL: admin login still accepts a shared password"
            exit 1
          fi
          if grep -rn "ADMIN_PASSWORD" app lib --include='*.ts' | grep -v "AGENTS.md\|SECURITY.md"; then
            echo "FAIL: ADMIN_PASSWORD path still exists in app code"
            exit 1
          fi
          grep -q "requireUser" lib/supabase/auth.ts || { echo "FAIL: requireUser helper is missing"; exit 1; }
          echo "Admin auth OK"
