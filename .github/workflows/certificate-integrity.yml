name: Certificate Integrity

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: certificate-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Certificates require server-verified quiz passes
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "quiz_verified_at" "app/api/courses/[slug]/certificate/route.ts" || fail "certificate route does not require a verified quiz pass"
          grep -q "buildCourseReviewQuestions" app/api/progress/route.ts || fail "progress does not grade against canonical questions"
          grep -q "quizAnswers" app/api/progress/route.ts || fail "progress does not accept server-graded quiz submissions"
          echo "Certificate integrity OK"
