name: Contract Coverage

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contract-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Security contract must not silently shrink
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          count=$(grep -c "assert(" scripts/security-contract-check.mjs)
          echo "Contract assertions: $count"
          [ "$count" -ge 120 ] || fail "contract coverage regressed (expected >= 120, got $count)"
          for pat in "SUPABASE_SECRET_KEY" "ADMIN_PASSWORD" "UROPAY_" "NVIDIA_API_KEY"; do
            grep -q "$pat" scripts/scan-secrets.mjs || fail "secret scanner lost pattern: $pat"
          done
          echo "Contract coverage OK"
