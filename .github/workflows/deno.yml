# This workflow installs Deno and type-checks the repo's standalone scripts.
# Repo-wide `deno lint` is intentionally NOT used: its Deno-runtime rules
# (require-await, no-node-globals, no-window) flag correct Next.js idioms.

name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deno-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.46.3

      - name: Type-check gate scripts under a second runtime
        run: deno check scripts/scan-secrets.mjs scripts/security-contract-check.mjs scripts/release.mjs
