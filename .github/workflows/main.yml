name: Main

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Payment guard tests (behavioural, offline)
        # The rest of `pnpm test` asserts against the live x402 facilitator and
        # needs network egress, so it is not run here. These suites are fully
        # offline and pin the payment invariants: one grant per authorization
        # under concurrency, no grant when settlement reports success but the
        # claim is already taken, fail-closed when the claim store is down, an
        # over-budget machine caller refused without being charged, a paid
        # machine request whose inference cost stays inside the price paid, and
        # a free trial that cannot be bought, bought twice, or reach Max.
        run: >-
          pnpm exec node --import ./scripts/test-loader.mjs
          --experimental-strip-types --test tests/x402-payment-guard.test.ts
          tests/x402-machine-limits.test.ts tests/free-trial.test.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Dummy public values so `next build` can statically evaluate
          # client modules (lib/supabase/client.ts) without real secrets.
          # Real secrets must come from repo/environment secrets in deploy workflows.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_SITE_URL: https://mun-ai-app.vercel.app
