name: Secret Scanning

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Only .env.example may be tracked
        run: |
          tracked=$(git ls-files | grep -E "^\.env" || true)
          echo "$tracked"
          if echo "$tracked" | grep -v -x ".env.example" | grep -q .; then
            echo "FAIL: real .env files are tracked. Only .env.example may be committed."
            exit 1
          fi

      - name: Repository secret scanner
        run: node scripts/scan-secrets.mjs
