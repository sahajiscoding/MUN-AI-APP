name: Security Matrix

# One workflow, ~80 independently-visible checks: each matrix gate runs
# scripts/security-matrix.mjs <gate-id> and reports pass/fail on its own.
# Gates are fast (no installs) and fail-fast is OFF so one red gate never
# cancels the rest. To add a check, add a gate to the script AND the list below.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - no-tracked-env-files
          - env-example-no-live-keys
          - no-private-keys
          - no-aws-keys
          - no-github-pat
          - no-admin-password
          - next-public-allowlist
          - gitignore-env-coverage
          - hsts-header
          - frame-deny
          - nosniff-header
          - referrer-policy
          - static-csp-fallback
          - no-unsafe-eval
          - nonce-per-request
          - https-redirect
          - server-side-session-verify
          - unauthenticated-401
          - admin-login-identity
          - no-shared-admin-password
          - owner-only-grants
          - email-verification
          - no-account-enumeration
          - admin-identity-binding
          - session-revocation
          - cookie-httponly
          - cookie-samesite-strict
          - cookie-secure-prod
          - session-4h-cap
          - secret-32-minimum
          - mfa-enforced
          - no-eval
          - no-new-function
          - no-pickle
          - no-weak-hashes
          - sha256-only
          - zod-coverage
          - strict-schemas
          - uuid-route-ids
          - safe-json-parse
          - no-server-imports-in-components
          - no-dangerous-html
          - nvidia-key-server-only
          - service-secrets-server-only
          - auth-endpoints-limited
          - admin-login-limited
          - ai-route-limited
          - payments-limited
          - webhook-limited
          - public-forms-limited
          - webhook-verify-present
          - timing-safe-compare
          - replay-window
          - raw-body-verify
          - webhook-idempotency
          - authoritative-status
          - no-static-recon-secret
          - commission-repair
          - rls-enabled
          - auth-uid-scoping
          - no-open-policies
          - client-revokes
          - advisory-serialization
          - self-referral-guard
          - api-no-store
          - vary-header
          - no-stack-in-responses
          - referral-404
          - no-secret-console-logs
          - error-helpers-defined
          - csrf-origin-check
          - lockfile-tracked
          - no-floating-ranges
          - jsyaml-override
          - packagemanager-pin
          - no-install-hooks
          - lockfile-next-sync
          - contract-asserts-floor
          - scanner-patterns-intact
          - workflows-least-privilege
          - actions-pinned
          - no-secrets-in-workflows
          - triage-log-present
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run gate ${{ matrix.gate }}
        run: node scripts/security-matrix.mjs ${{ matrix.gate }}
