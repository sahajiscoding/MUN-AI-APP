# This repo has no standalone webpack config: Next.js drives webpack
# internally, so this workflow verifies the production webpack build via
# `next build` (pnpm, see packageManager in package.json). Node 20+ only
# because Next.js 16 cannot build on Node 18.

name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: webpack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.19.0
        run_install: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare pnpm@11.19.0 --activate

    - name: Build
      run: |
        pnpm install --frozen-lockfile
        pnpm build
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        NEXT_PUBLIC_SITE_URL: https://mun-ai-app.vercel.app
