allowBuilds:
  '@img/sharp': true
  unrs-resolver: true

overrides:
  # GHSA-mrhx-c7xc-m3w5: oversized constrained collections can exhaust memory.
  # Cover Zod 3.x copies in x402 as well as the app and ESLint's Zod 4.x copies.
  zod: 4.6.6
  # GHSA-w74x-v6f9-j3xg and related URI normalization advisories.
  # Transitive via x402's AJV dependency; keep its existing 3.x API.
  fast-uri@3: 3.1.9
  # Security override: CVE-2026-84375 (GHSA-2883-xcg3-v3hh) — js-yaml <4.3.2
  # DoS via unbounded merge-key expansion. Transitive via eslint toolchain.
  js-yaml: 4.3.2
  # GHSA-68fv-2mgg-jv7q (CVE-2026-93749) — indexed source-map offsets can cause
  # event-loop DoS. Transitive via the PostCSS build toolchain; patched in 1.2.2.
  # Several independent postcss copies exist in the tree (next pins
  # postcss@8.5.23 internally, plus autoprefixer / tailwindcss / postcss-import
  # / postcss-js / postcss-load-config / postcss-nested), so bumping the direct
  # `postcss` dependency alone does not cover the whole graph.
  source-map-js: 1.2.2
  # GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 / GHSA-q2hr-2g5m-vwhr — DoS in
  # brace-expansion. Patched floors: 1.1.21 (1.x) and 5.0.12 (5.x).
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  # Security override: GHSA-wq5f-xc86-pv6w — sharp <0.35.5, vulnerable librsvg
  # (CVE-2026-96889). Optional dependency of `next`; next@16.3.8 declares
  # `sharp: ^0.35.4`, so 0.35.5 satisfies the parent range.
  sharp: 0.35.5
  # Security override: GHSA-rj75-hqrm-r3gf (CVE-2026-104844) —
  # postcss-selector-parser <7.1.6 quadratic-complexity CPU exhaustion in flat
  # selector parsing. No patched 6.x exists (`legacy-v6` dist-tag is 6.1.4), so
  # the only version fix is the 7.x line. Verified API-compatible for our
  # consumers (tailwindcss@3.4.19, postcss-nested@6.2.0): identical deps and
  # engines, additive types only (`insertAfter`/`insertBefore` rest params,
  # `walkUniversals`), and the same runtime defaults (`lossy: false`).
  postcss-selector-parser: 7.1.6

# TEMPORARY WAIVER (GHSA-vfj7-8cjw-p6xm, braces stack-exhaustion DoS):
# no patched release is published on npm yet (latest is 3.0.3), so a version
# override is impossible today. When braces 3.0.4+ ships, replace this waiver
# with a `braces: 3.0.4` override above.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
